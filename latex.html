<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>在线 LaTeX 编辑器 - 课题组网站</title>
    <meta name="description" content="在浏览器中直接编写并编译 LaTeX，支持多文件、BibTeX 与 PDF 预览。" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f5f5; color: #222;
        display: flex; flex-direction: column; min-height: 100%;
      }
      .latex-topbar {
        display: flex; align-items: center; justify-content: space-between;
        gap: 1rem; padding: 0 1.2rem; height: 52px; flex: 0 0 auto;
        background: #1a1a2e; color: #fff;
      }
      .latex-topbar a { color: #ccc; text-decoration: none; font-size: .9rem; white-space: nowrap; }
      .latex-topbar a:hover { color: #fff; }
      .latex-topbar strong { font-size: .95rem; }
      .latex-frame-wrap { flex: 1 1 auto; min-height: 0; position: relative; }
      .latex-frame-wrap iframe {
        position: absolute; inset: 0; width: 100%; height: 100%;
        border: 0; background: #fff;
      }
      .latex-notice { padding: .5rem 1.2rem; background: #fff8e6; color: #6b5317; font-size: .8rem; flex: 0 0 auto; }
      .latex-notice a { color: #1a1a2e; }
      @media (max-width: 720px) {
        .latex-topbar { padding: 0 .8rem; }
        .latex-topbar strong { font-size: .85rem; }
      }
    </style>
  </head>
  <body>
    <header class="latex-topbar" aria-label="LaTeX editor navigation">
      <a href="index.html">← 返回主页</a>
      <strong>在线 LaTeX 编辑器</strong>
      <a href="https://texlyre.github.io/texlyre/" target="_blank" rel="noreferrer">新窗口打开 ↗</a>
    </header>

    <p class="latex-notice">
      编辑器基于开源的 TeXlyre（AGPL-3.0），编译完全在浏览器本地完成，不会把文档上传到服务器。
      如果页面没有加载，请点击右上角“新窗口打开”。
    </p>

    <main class="latex-frame-wrap" aria-label="LaTeX editor">
      <iframe
        src="https://texlyre.github.io/texlyre/"
        title="在线 LaTeX 编辑器"
        allow="clipboard-read; clipboard-write; fullscreen; web-share; encrypted-media"
        referrerpolicy="no-referrer"
        loading="eager"
      ></iframe>
    </main>
  </body>
</html>
